amcl:
  ros__parameters:
    use_sim_time: True
    # Trust odom a bit more on small in-place twists (office walls look alike)
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.15
    base_frame_id: "base_footprint"
    # Beam skip: ignore rays that hit moving dyn_obs (not in static map)
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.85
    beam_skip_threshold: 0.45
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.3
    laser_model_type: "likelihood_field"
    max_beams: 48
    # 性能微调：粒子略增；更新阈值保持原值（过勤会抖、到处转）
    max_particles: 700
    min_particles: 200
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # No recovery jump — dyn_obs otherwise make the cloud “飘”
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 3
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.25
    # GT localization (gt_localization node) owns map→odom — AMCL must NOT broadcast TF
    tf_broadcast: false
    transform_tolerance: 0.5
    # Laser updates unused for TF; keep thresholds high so AMCL stays idle
    update_min_a: 0.40
    update_min_d: 0.30
    z_hit: 0.75
    z_max: 0.05
    z_rand: 0.15
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    # EKF owns odom→base_footprint TF; Nav2 uses filtered odom.
    bt_loop_duration: 20
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # Placeholder rewritten by nav_bringup_gazebo2.launch.py
    default_nav_to_pose_bt_xml: "<nav_bt_xml>"

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.4
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 14.0

    general_goal_checker:
      # 【2026-11-25】原来是 True：一旦满足过就永远判成功。实测日志里
      # `Reached the goal!` 之后任务层立刻测到 dxy=0.443/0.308 —— 车被
      # 膨胀/障碍推走 0.1~0.44m 仍算"到了"，任务层再判 POSE_GATE_FAIL →
      # 原地转 → 重新发导航，白丢 5~10s（用户说的"到点附近又转一圈"）。
      # 改 False：必须"当下"落在容差内才算到，Nav2 会自己补最后那一下。
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      # 容差必须 ≥0.34：取货 park 处局部膨胀 0.55 + 车身 footprint，
      # DWB 物理上只能到 ~0.31m 外（上一局 0.308/0.312 两次都是 0.31 就判成功）。
      # 0.32 太宽：起点/中途落进 0.32 时 Nav2 0.046s 就判 Reached、车一步没走，
      # 任务层再判 POSE_GATE_FAIL → 原地转 → 0.14m/s CREEP 爬 5.5s。
      # 0.22 太紧（2026-11-25 10:35 实测）：永远进不了 0.22 → Nav2 一直
      # "想再挪一点点"，车原地画圈 72s（3 号块"一直转圈"）。
      # 剩下的 0.31→贴块由任务层 CREEP 开环推进（它本就能压进膨胀区）。
      xy_goal_tolerance: 0.34
      # 0.85rad≈49°：以前到此为止，剩下的半圈全由任务层 snap 慢速补，
      # 每次停两回转两回（"转过头再转一圈"）。现在让 DWB 用 0.95rad/s
      # 自己收完到 0.30，snap 只做 ≤0.35 的微调。放街区靠另有 0.90 临时放宽。
      yaw_goal_tolerance: 0.30

    # Line speed kept; yaw slowed — fast spin was skewing Nav / AMCL
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      # 不再允许 DWB 倒车当前进：实测 48% 采样是 vx=-0.55 满速倒车，
      # 而倒车限速只有正向(2.7)的 1/5 → 整腿只有 0.55m/s；且贴墙倒车易撞。
      # 需要倒车脱困时由任务层 drive_openloop_distance(负距离) / UNSTICK 盲退负责。
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 2.7
      max_vel_y: 0.0
      # 角速度必须与 velocity_smoother 完全一致！原来这里 0.95 而 smoother 只放 0.62，
      # DWB 规划出的弧线实际转不过来 → 反复重规划、绕目标两整圈、原地磨。（2026-11-25 实测）
      # 0.85 是任务层 AIM_MAP wz=-0.850 已长期验证可用的安全值。
      max_vel_theta: 0.85
      min_speed_xy: 0.0
      max_speed_xy: 2.7
      min_speed_theta: 0.0
      acc_lim_x: 2.4
      acc_lim_y: 0.0
      acc_lim_theta: 1.15
      decel_lim_x: -2.4
      decel_lim_y: 0.0
      decel_lim_theta: -1.15
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 28
      # 高速前瞻加长：少短视拧弯，贴轨靠弱化 PathAlign/PathDist
      sim_time: 1.6
      sim_granularity: 0.05
      angular_sim_granularity: 0.06
      # 【2026-11-25】0.30 → 0.34，与 goal_checker 齐平。
      # 0.30 时 RotateToGoal 要等车进 0.30 才起效，但该处（取货 park /
      # C 垫旁）物理极限就是 ~0.31m，永远进不去 → 车在目标外"进入-退出"
      # 反复绕圈（实测 5.4s 只走 0.21m、9.8s 只走 0.48m）。抬到 0.34 后
      # 只要 BT 判"xy 到了"，DWB 就立刻原地把朝向收完，不再绕。
      xy_goal_tolerance: 0.34
      # 与 general_goal_checker 同步（RotateToGoal 靠它判定何时原地收尾）
      yaw_goal_tolerance: 0.30
      transform_tolerance: 0.3
      prune_plan: true
      prune_distance: 1.5
      critics: ["RotateToGoal", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      RotateToGoal:
        enabled: true
        scale: 1.0
        slowing_factor: 5.0
      BaseObstacle:
        enabled: true
        # 必须够硬，否则会穿膨胀直接撞墙；略低于旧 20，减轻假墙卡死
        scale: 18.0
      GoalAlign:
        enabled: true
        scale: 2.2
      PathAlign:
        enabled: true
        scale: 5.5
      PathDist:
        enabled: true
        scale: 10.0
      GoalDist:
        enabled: true
        scale: 24.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 7.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.07
      footprint: "[[0.38, 0.40], [0.38, -0.40], [-0.36, -0.40], [-0.36, 0.40]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 【2026-11-22 修“门口来回摩擦”】0.38 与内切半径(0.36+padding0.03=0.39) 冲突，
        # 日志里每次都在报 "inflation radius (0.380) is smaller than the computed
        # inscribed radius (0.390)" ⇒ 局部代价场没有梯度，DWB 只知道“撞/不撞”，
        # 贴墙时全靠 253 死带硬判 ⇒ 在 (-3.8,-1.55) 贴着墙侧反复前进/倒车蹭。
        # 抬到 0.55（>0.39，合法）后 DWB 有 0.39→0.55 的软代价，会主动离墙走。
        # 253 死带宽度仍由内切半径决定 ⇒ 针眼/门洞的通行口径不变。
        cost_scaling_factor: 4.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_persistence: 0.0
        expected_update_rate: 0.0
        combination_method: 1
        observation_sources: scan zone_keepout dyn_obs_predict
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.25
          obstacle_max_range: 6.0
          # 忽略车身/近距误点，否则局部图围一圈灰点 → 原地转
          obstacle_min_range: 0.45
          inf_is_valid: false
        # Place pads A/B/C (from task_sm) — plan around so chassis doesn't climb cubes
        zone_keepout:
          topic: /yzbot/zone_keepout
          max_obstacle_height: 2.0
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0
          observation_persistence: 4.0
        # Short-horizon predicted bars (mild persist — avoid far crawl)
        dyn_obs_predict:
          topic: /yzbot/dyn_obs_predict
          max_obstacle_height: 2.0
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0
          observation_persistence: 0.22
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 4
        group_connectivity_type: 8
      always_send_full_costmap: False


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.38, 0.40], [0.38, -0.40], [-0.36, -0.40], [-0.36, 0.40]]"
      footprint_padding: 0.02
      resolution: 0.08
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_persistence: 0.0
        expected_update_rate: 0.0
        combination_method: 1
        # 全局不画动障预测：NavFn 走短几何路；近处由 local + dyn_obs_predict 躲杆
        observation_sources: scan zone_keepout
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.25
          obstacle_max_range: 6.0
          obstacle_min_range: 0.45
          inf_is_valid: false
        zone_keepout:
          topic: /yzbot/zone_keepout
          max_obstacle_height: 2.0
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0
          observation_persistence: 4.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 3
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 【2026-11-22 修“门口来回摩擦”】原来 radius=0.38 与 footprint 内切半径
        # (0.36+padding0.02=0.38) 相等 ⇒ 膨胀层没有任何代价梯度，只有一条 0.38 厚的
        # 253 死带；NavFn 只按最短几何找路，必然贴着竖墙北尖角 (-3.25,-0.70) 拐弯
        # (离线复现最窄 clearance 仅 0.39m)。而车体是 0.74×0.80 矩形，绕尖角要
        # sqrt(0.38²+0.40²)=0.55m ⇒ DWB 前进轨迹全判碰、只能倒车，下一周期再前进
        # ⇒ 车在原地来回蹭 25s 直到看门狗 cancel(日志 20:38/21:00 两次都停在
        # (-3.75,-1.53)/(-3.81,-1.56)，x 正好等于墙面 -3.375 减半车宽+padding)。
        # 把半径抬到 0.80、scaling 降到 3.0 后：253 死带宽度不变(通行性/针眼口径不变)，
        # 但 0.38→0.80 出现真梯度，规划器会走走廊中线。离线复算：最窄 clearance
        # 0.39→0.65m(起点处)、全程均值 0.60→0.90m，绕尖角有余量，路径只长 1.9m。
        cost_scaling_factor: 3.0
        inflation_radius: 0.80
      always_send_full_costmap: False

map_server:
  # The yaml_filename does not need to be specified since it going to be set by defaults in launch.
  # If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
  # file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""
    use_sim_time: true

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.8
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 200
      do_refinement: False

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.80
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.2

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 5
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    # High smoother rate + soft accel = silk.
    # ！！wz 三个限幅必须与 DWB 的 max_vel_theta/acc_lim_theta/decel_lim_theta 一致！！
    # 原来 yaw 上限只放 0.62、加速度只放 0.58（DWB 假设 0.95/1.35），DWB 用错误模型
    # 规划弧线 → 实际欠转 → 绕圈/原地磨；现与 DWB 统一为 0.85/1.15。（2026-11-25 实测定位）
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.7, 0.0, 0.85]
    min_velocity: [-0.10, 0.0, -0.85]
    max_accel: [2.4, 0.0, 1.15]
    max_decel: [-2.4, 0.0, -1.15]
    odom_topic: "odometry/filtered"
    odom_duration: 0.12
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 1.5
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Stop before impact, then Nav2 can replan; outer ring only slows
    polygons: ["PolygonStop", "PolygonCrawl"]
    PolygonStop:
      type: "circle"
      # 0.48 -> 0.38 -> 0.32：搬运时块夹在车头前 ~0.42m，圈必须 <0.42；
      # 门洞挤压现场实测车中心距墙只有 0.34m（竖墙与杆的 ~0.9m 缝），0.38 的圈
      # 让碰撞器在整段过门路上持续急停 → 来回徘徊。0.32 距块仍留 0.10m 余量。
      # Humble 的 collision_monitor 不支持运行时改 polygon 参数，只能在这里定死。
      radius: 0.32
      action_type: "stop"
      min_points: 3
      visualize: False
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonCrawl:
      type: "circle"
      # 只在真正靠近时慢行，避免远处物块旁爬行
      radius: 0.48
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.45
      visualize: False
      polygon_pub_topic: "polygon_crawl"
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.05
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking/SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
