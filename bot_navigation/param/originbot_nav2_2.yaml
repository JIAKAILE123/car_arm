amcl:
  ros__parameters:
    use_sim_time: True
    # Trust odom a bit more on small in-place twists (office walls look alike)
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.15
    base_frame_id: "base_footprint"
    # Beam skip: ignore rays that hit moving dyn_obs (not in static map)
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.85
    beam_skip_threshold: 0.45
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.3
    laser_model_type: "likelihood_field"
    max_beams: 48
    # 性能微调：粒子略增；更新阈值保持原值（过勤会抖、到处转）
    max_particles: 700
    min_particles: 200
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # No recovery jump — dyn_obs otherwise make the cloud “飘”
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 3
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.25
    # GT localization (gt_localization node) owns map→odom — AMCL must NOT broadcast TF
    tf_broadcast: false
    transform_tolerance: 0.5
    # Laser updates unused for TF; keep thresholds high so AMCL stays idle
    update_min_a: 0.40
    update_min_d: 0.30
    z_hit: 0.75
    z_max: 0.05
    z_rand: 0.15
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    # EKF owns odom→base_footprint TF; Nav2 uses filtered odom.
    bt_loop_duration: 20
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # Placeholder rewritten by nav_bringup_gazebo2.launch.py
    default_nav_to_pose_bt_xml: "<nav_bt_xml>"

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.4
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.22
      movement_time_allowance: 12.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.32
      # 到点勿死磕朝向；本地 FACE/DOCK 再细调
      yaw_goal_tolerance: 0.85

    # Line speed kept; yaw slowed — fast spin was skewing Nav / AMCL
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      # 允许小幅倒车，否则卡住时只能靠 BackUp 恢复 → 慢倒且不转弯
      min_vel_x: -3.0
      min_vel_y: 0.0
      max_vel_x: 3.0
      max_vel_y: 0.0
      # 线速度保持；角速度压低 → 到点少拧圈
      max_vel_theta: 0.55
      min_speed_xy: 0.0
      max_speed_xy: 3.0
      min_speed_theta: 0.0
      acc_lim_x: 2.4
      acc_lim_y: 0.0
      acc_lim_theta: 0.50
      decel_lim_x: -2.4
      decel_lim_y: 0.0
      decel_lim_theta: -0.50
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      # 高速前瞻加长：少短视拧弯，贴轨靠弱化 PathAlign/PathDist
      sim_time: 1.4
      sim_granularity: 0.05
      angular_sim_granularity: 0.08
      xy_goal_tolerance: 0.34
      yaw_goal_tolerance: 0.80
      transform_tolerance: 0.3
      prune_plan: true
      prune_distance: 1.5
      critics: ["RotateToGoal", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      RotateToGoal:
        enabled: true
        scale: 0.7
        slowing_factor: 8.0
      BaseObstacle:
        enabled: true
        # 略加强对预测杆；勿过高，否则物块旁空转找不到
        scale: 36.0
      GoalAlign:
        enabled: true
        scale: 2.2
      PathAlign:
        enabled: true
        scale: 8.0
      PathDist:
        enabled: true
        scale: 12.0
      GoalDist:
        enabled: true
        scale: 24.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 7.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.07
      footprint: "[[0.38, 0.40], [0.38, -0.40], [-0.36, -0.40], [-0.36, 0.40]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_persistence: 0.0
        expected_update_rate: 0.0
        combination_method: 1
        observation_sources: scan zone_keepout dyn_obs_predict
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.25
          obstacle_max_range: 6.0
          # 忽略车身/近距误点，否则局部图围一圈灰点 → 原地转
          obstacle_min_range: 0.45
          inf_is_valid: false
        # Place pads A/B/C (from task_sm) — plan around so chassis doesn't climb cubes
        zone_keepout:
          topic: /yzbot/zone_keepout
          max_obstacle_height: 2.0
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0
          observation_persistence: 4.0
        # Short-horizon predicted bars (mild persist — avoid far crawl)
        dyn_obs_predict:
          topic: /yzbot/dyn_obs_predict
          max_obstacle_height: 2.0
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0
          observation_persistence: 0.40
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 4
        group_connectivity_type: 8
      always_send_full_costmap: False


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.38, 0.40], [0.38, -0.40], [-0.36, -0.40], [-0.36, 0.40]]"
      footprint_padding: 0.02
      resolution: 0.08
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_persistence: 0.0
        expected_update_rate: 0.0
        combination_method: 1
        # 全局不画动障预测：NavFn 走短几何路；近处由 local + dyn_obs_predict 躲杆
        observation_sources: scan zone_keepout
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.25
          obstacle_max_range: 6.0
          obstacle_min_range: 0.45
          inf_is_valid: false
        zone_keepout:
          topic: /yzbot/zone_keepout
          max_obstacle_height: 2.0
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0
          observation_persistence: 4.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 3
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.8
        inflation_radius: 0.55
      always_send_full_costmap: False

map_server:
  # The yaml_filename does not need to be specified since it going to be set by defaults in launch.
  # If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
  # file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""
    use_sim_time: true

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.8
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 200
      do_refinement: False

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.70
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 5
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    # High smoother rate + soft accel = silk; yaw still capped for AMCL
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [3.0, 0.0, 0.55]
    min_velocity: [-3.0, 0.0, -0.55]
    max_accel: [2.2, 0.0, 0.50]
    max_decel: [-2.2, 0.0, -0.50]
    odom_topic: "odometry/filtered"
    odom_duration: 0.12
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 1.5
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Stop before impact, then Nav2 can replan; outer ring only slows
    polygons: ["PolygonStop", "PolygonCrawl"]
    PolygonStop:
      type: "circle"
      radius: 0.40
      action_type: "stop"
      min_points: 3
      visualize: False
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonCrawl:
      type: "circle"
      # 只在真正靠近时慢行，避免远处物块旁爬行
      radius: 0.46
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.65
      visualize: False
      polygon_pub_topic: "polygon_crawl"
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.05
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking/SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
