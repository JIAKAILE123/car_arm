# Fallback when use_cube_standoff:=false.
# Default: per-cube PARK at cube_x+grasp_standoff_m (see approach_xy_for_cube).
# Cube XY live in vision_pose._KNOWN_CUBES (must match offic_room.world).

red_approach:
  x: -2.30
  y: -7.60
  yaw: 3.1416

blue_approach:
  x: -5.30
  y: -2.80
  yaw: 3.1416

# Place zones on the west side, split by existing walls (y≈-8.2 and y≈-4.4)
# A is east of the wall tip and further south, clear of the dead corner.
zone_a:
  x: 4.20
  y: -1.80
  yaw: 0.0

zone_b:
  x: 0.60
  y: -3.40
  yaw: 0.0

zone_c:
  x: -6.00
  y: -2.90
  yaw: 0.0

# Pre-match mapping (example from rules PDF):
#   x→red, y→blue; count≥threshold → high_zone; else → low_zone
mapping:
  x_color: red
  y_color: blue
  threshold: 3
  high_zone: A
  low_zone: C
