# Fallback when use_cube_standoff:=false.
# Default: per-cube PARK at cube_x+grasp_standoff_m (see approach_xy_for_cube).
# Cube XY live in vision_pose._KNOWN_CUBES (must match offic_room.world).

red_approach:
  x: -6.49
  y: -2.80
  yaw: 3.1416

blue_approach:
  x: -5.78
  y: 5.50
  yaw: 3.1416

# Place zones: A green | B yellow | C blue (official colors)
# A south hall | B mid open | C north-ish (after drag layout)
zone_a:
  x: 5.40
  y: -11.80
  yaw: 0.0

zone_b:
  x: 0.50
  y: -4.20
  yaw: 0.0

zone_c:
  x: -0.77
  y: 2.71
  yaw: 0.0

# Pre-match mapping (example from rules PDF):
#   x→red, y→blue; count≥threshold → high_zone; else → low_zone
mapping:
  x_color: red
  y_color: blue
  threshold: 3
  high_zone: A
  low_zone: C
